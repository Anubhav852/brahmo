name: Python CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        pip install supabase
    - name: Lint with flake8
      run: |
        pip install flake8
        # Exclude frontend and virtual environment folders
        flake8 . --count --select=E9,F63,F7,F82 --exclude=venv,node_modules,brahmo-frontend --show-source --statistics